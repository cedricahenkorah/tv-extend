name: TVExtend
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  TVExtend:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TV Extend
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: false # show a Dock icon too (right-click it for the controls)
        NSScreenCaptureUsageDescription: TV Extend captures its virtual display to stream it to your TV.
        NSLocalNetworkUsageDescription: TV Extend streams the virtual display to your TV on the local network.
    # Signing comes from Config/Signing.xcconfig (+ your gitignored Config/Local.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tvextend.mac
        PRODUCT_NAME: TVExtend
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TVExtend-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # generated by Tools/make-icon.swift
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - sdk: CoreGraphics.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: VideoToolbox.framework
      - sdk: AVFoundation.framework
